name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Java
      # ----------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ----------------------------------------------------------
      # Gradle
      # ----------------------------------------------------------

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set GRADLE_OPTS to override org.gradle.java.home
        shell: bash
        run: |
          # Ensure Gradle uses the runner's JAVA_HOME instead of the Windows path committed in gradle.properties
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JAVA_HOME" >> $GITHUB_ENV

      - name: Install Android command-line tools and SDK components
        shell: bash
        run: |
          set -e
          # Use a local SDK root that persists between steps via $GITHUB_ENV
          ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          mkdir -p "$ANDROID_SDK_ROOT"

          # Download and install the Android command-line tools
          curl -sS https://dl.google.com/android/repository/commandlinetools-linux-latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv "$ANDROID_SDK_ROOT/cmdline-tools"/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/" || true

          # Persist Android SDK environment variables for subsequent steps
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV

          # Make sdkmanager available for this step
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          # Accept licenses and install required components
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # ----------------------------------------------------------
      # Android SDK
      # ----------------------------------------------------------

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME is not set."
            exit 1
          fi

          echo ""
          echo "Android SDK location:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Installed Android platforms:"
          find "$ANDROID_HOME/platforms" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' 2>/dev/null | sort -V || true

          echo ""
          echo "Installed Android Build Tools:"
          find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' 2>/dev/null | sort -V || true

          echo ""
          echo "Checking Android API 36..."

          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "::error::Android SDK Platform 36 was not found."
            echo "::error::This project uses compileSdk = 36."
            exit 1
          fi

          echo "Android API 36 found."

          echo ""
          echo "Checking Android Build Tools..."

          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "::error::Android Build Tools 36.0.0 was not found."
            exit 1
          fi

          echo "Android Build Tools 36.0.0 found."

      # ----------------------------------------------------------
      # Gradle Wrapper
      # ----------------------------------------------------------

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      # ----------------------------------------------------------
      # Validation
      # ----------------------------------------------------------

      - name: Kotlin compile check
        run: ./gradlew compileDebugKotlin --console=plain --no-daemon --stacktrace

      - name: Resource check
        run: ./gradlew mergeDebugResources --console=plain --no-daemon --stacktrace

      - name: Lint check
        run: ./gradlew lintDebug --console=plain --no-daemon --stacktrace

      # ----------------------------------------------------------
      # Inject Permanent Debug Keystore
      # ----------------------------------------------------------

      - name: Inject permanent debug keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EPUB_APP_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          echo "Permanent debug keystore installed."

      # ----------------------------------------------------------
      # Build APK
      # ----------------------------------------------------------

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain --no-daemon --stacktrace

      # ----------------------------------------------------------
      # Verify APK signing certificate
      # ----------------------------------------------------------

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/the-livre-magicae.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in Android SDK Build Tools."
            exit 1
          fi

          echo "Using: $APKSIGNER"
          echo "APK signing certificate:"

          "$APKSIGNER" verify --print-certs "$APK"

      # ----------------------------------------------------------
      # APK validation
      # ----------------------------------------------------------

      - name: Inspect APK permissions
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/the-livre-magicae.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not produced."
            exit 1
          fi

          AAPT2="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aapt2 \
            -print 2>/dev/null |
            sort -V |
            tail -n 1)"

          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 was not found."
            exit 1
          fi

          echo "Using aapt2:"
          echo "$AAPT2"

          echo ""
          echo "APK permissions:"
          "$AAPT2" dump permissions "$APK"

          if "$AAPT2" dump permissions "$APK" |
             grep -qi "android.permission.INTERNET"; then
            echo "::error::APK declares INTERNET permission."
            exit 1
          fi

          echo ""
          echo "OK: APK does not declare INTERNET permission."

      # ----------------------------------------------------------
      # Upload APK
      # ----------------------------------------------------------

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: the-livre-magicae-apk
          path: app/build/outputs/apk/debug/the-livre-magicae.apk
          if-no-files-found: error
          retention-days: 10
